    feature_type_count: 15
    selection_anchor: first

  - task_id: 3902
    dataset_name: pc4
    feature_type: numeric
    overall_registry_position: 21
    feature_type_rank: 8
    feature_type_count: 15
    selection_anchor: lower_median

  - task_id: 3904
    dataset_name: jm1
    feature_type: numeric
    overall_registry_position: 28
    feature_type_rank: 15
    feature_type_count: 15
    selection_anchor: last

strengths:
  - name: "null"
    interaction_coefficient: 0.0
    active_ground_truth: false

  - name: weak
    interaction_coefficient: 0.5
    active_ground_truth: true

  - name: moderate
    interaction_coefficient: 1.0
    active_ground_truth: true

  - name: strong
    interaction_coefficient: 1.5
    active_ground_truth: true

protocol:
  n_realizations: 5
  max_rows: 5000

  train_fraction: 0.60
  validation_fraction: 0.20
  test_fraction: 0.20

  n_true_interactions: 3
  n_main_effects: 3
  min_eligible_features: 9

  max_states_per_feature: 8

  main_effect_coefficient: 1.0
  target_expected_prevalence: 0.50
  link: logistic

  discovery_runs: 5
  residual_crossfit_folds: 5
  selection_threshold: 0.60
  isr_threshold: 0.60
  candidate_k_rule: min_p_minus_1_20

  base_seed: 26090800

generator:
  original_labels_used: false
  preserve_real_X: true
  missing_values: explicit_missing_state

  numeric_state_encoding: empirical_quantile_states
  categorical_state_encoding: top_levels_plus_other

  main_effect_surface: centered_random_state_effect

  interaction_surface: gaussian_cell_surface
  interaction_purification: empirical_weighted_two_way_functional_anova
  interaction_purification_solver: direct_weighted_least_squares_projection

  interaction_pair_eligibility: positive_empirical_interaction_df
  minimum_interaction_df: 1
  interaction_pair_matching: seeded_disjoint_backtracking

  surface_max_attempts: 32

  component_standardization: unit_standard_deviation

  common_random_numbers_across_strengths: true
  intercept_calibration: target_expected_prevalence

  purification_tolerance: 1.0e-10
  purification_max_iterations: 1000

comparators:
  - Main NAM
  - Full AG-NAM
  - Oracle AG-NAM
  - Random-Pair NAM
  - No-ISR AG-NAM
  - Single-Run AG-NAM

statistics:
  experimental_unit: dataset
  realization_aggregation: mean_over_5_realizations

  primary_condition: moderate
  primary_metric: interaction_auprc_minus_random_prevalence

  primary_test: one_sided_wilcoxon_greater
  alpha: 0.05
  multiplicity_adjustment: none_single_primary

  bootstrap_resamples: 10000
  bootstrap_seed: 26090806

  secondary_inference: descriptive_only