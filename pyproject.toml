[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agnam"
version = "1.0.0"
description = "Research implementation of AG-NAM for reproducible and interpretable feature interaction learning."
requires-python = ">=3.10,<3.11"

dependencies = [
    "torch>=2.5,<2.6",
    "numpy>=1.26,<2.0",
    "pandas>=2.3,<2.4",
    "scikit-learn>=1.7,<1.8",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "openml>=0.15,<0.16",
    "optuna>=4.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "joblib>=1.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

baselines = [
    "interpret-core==0.7.8",
    "catboost==1.2.10"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"